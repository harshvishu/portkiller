name: version

# Assisted version bump. Pick patch/minor/major; this computes the next version
# from the latest tag, stamps the three manifests on `release`, commits, and
# pushes the vX.Y.Z tag — which triggers release.yml.
#
# NOTE: GitHub does NOT trigger other workflows for a tag pushed with the default
# GITHUB_TOKEN. To make the pushed tag auto-start release.yml, add a repo secret
# RELEASE_PAT (a fine-grained PAT with contents:write). Without it, the bump +
# tag still happen, but you must start the release manually (re-push the tag or
# run release.yml from a tag).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semantic version bump"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compute next version
        id: next
        run: |
          git fetch --tags --force
          latest="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          latest="${latest:-v0.0.0}"
          current="${latest#v}"
          current="${current%%-*}"
          IFS='.' read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="${major}.${minor}.${patch}"
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "Next version: v${next} (previous: ${latest})"

      - name: Stamp manifests
        run: node scripts/set-version.mjs ${{ steps.next.outputs.version }}

      - name: Commit, tag, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json
          git commit -m "chore(release): v${{ steps.next.outputs.version }}"
          git tag "v${{ steps.next.outputs.version }}"
          git push origin release
          git push origin "v${{ steps.next.outputs.version }}"
