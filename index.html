<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Port Killer</title>
  </head>
  <body>
    <main id="app">
      <header class="header">
        <div class="brand">
          <svg class="brand-glyph" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
            <path fill="currentColor" d="M12 2.5 12 13 4.5 13 Z"/>
            <path fill="currentColor" d="M3.5 14.5 20.5 14.5 18 19.2 Q12 21.2 6 19.2 Z"/>
          </svg>
          <span class="brand-title">Port Killer</span>
          <span class="brand-version">v1.0.0</span>
        </div>
        <div class="header-right">
          <span id="spinner" class="spinner hidden" aria-hidden="true"></span>
          <span id="count" class="count">0</span>
          <button id="refresh" class="icon-btn" title="Refresh now" aria-label="Refresh now">⟳</button>
        </div>
      </header>

      <div id="search-bar" class="search-bar hidden">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search" type="text" placeholder="Filter by port, PID, app, or owner" autocomplete="off" spellcheck="false" />
        <button id="search-clear" class="search-clear hidden" title="Clear filter" aria-label="Clear filter">⨯</button>
        <button id="filter-toggle" class="filter-toggle" title="Filter options" aria-label="Toggle filter options" aria-expanded="false">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
            <path d="M2 3.5h12l-4.6 5.4v3.4l-2.8 1.4V8.9z" fill="currentColor" />
          </svg>
        </button>
      </div>

      <div id="controls" class="controls">
        <div class="chips" role="group" aria-label="Filter by category">
          <button class="chip active" data-category="all" aria-pressed="true">All</button>
          <button class="chip" data-category="killable" aria-pressed="false">Killable</button>
          <button class="chip" data-category="protected" aria-pressed="false">Protected</button>
          <button class="chip" data-category="exposed" aria-pressed="false">Exposed</button>
        </div>
        <div class="sort">
          <label class="sort-label" for="sort-key">Sort</label>
          <select id="sort-key" class="sort-select" aria-label="Sort key">
            <option value="port">Port</option>
            <option value="pid">PID</option>
            <option value="name">Name</option>
            <option value="cpu">CPU</option>
            <option value="memory">Memory</option>
          </select>
          <button id="sort-dir" class="sort-dir" title="Toggle sort direction" aria-label="Toggle sort direction">↑</button>
        </div>
      </div>

      <div class="divider"></div>

      <section id="content" class="content"></section>

      <div class="divider"></div>

      <footer class="footer">
        <div id="status" class="status hidden"></div>
        <div class="footer-row">
          <label class="login-toggle">
            <span class="login-toggle-text">Launch at login</span>
            <input id="autostart" class="switch-input" type="checkbox" />
            <span class="switch" aria-hidden="true"></span>
          </label>
          <button id="quit" class="text-btn" title="Quit Port Killer">Quit</button>
        </div>
      </footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
